<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GS&D Gauge Intake</title>
<style>
:root{--red:#d91c1c;--bg:#000;--card:#121212;--text:#f6f3f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:17px Arial,sans-serif;line-height:1.45}.wrap{max-width:820px;margin:auto;padding:18px}h1{font-size:clamp(42px,10vw,72px);margin:12px 0}p{color:#d0d0d0}.card{background:var(--card);border:1px solid #6e0b14;border-radius:16px;padding:16px;margin:16px 0}form{display:grid;gap:12px}label{font-weight:700;display:grid;gap:5px}input,select,textarea{font:inherit;background:#050505;color:#fff;border:1px solid #6e0b14;border-radius:10px;padding:10px;min-height:44px}textarea{min-height:110px}.btn{font:800 17px Arial;background:var(--red);color:#fff;border:0;border-radius:10px;padding:15px;text-align:center;text-decoration:none;cursor:pointer}.secondary{background:#242424}.hidden{display:none}.result{white-space:pre-wrap;overflow-wrap:anywhere;background:#050505;border:1px solid #6e0b14;border-radius:10px;padding:12px}.note{border-left:4px solid var(--red);padding:10px;background:#24080a}.actions{display:grid;gap:10px;margin-top:12px}
</style>
</head>
<body><main class="wrap">
<h1>GS&D Intake</h1>
<p>Gauge creates a proof record before an intake can move.</p>
<section class="card"><form id="intakeForm">
<label>Service<input name="service" value="Diagnostics / Repair" required></label>
<label>Name / Entity<input name="name" required></label>
<label>Email<input name="email" type="email" required></label>
<label>Phone<input name="phone"></label>
<label>Vehicle / Unit / Asset / System<input name="asset"></label>
<label>Year / Make / Model<input name="vehicle"></label>
<label>Mileage / Hours<input name="mileage"></label>
<label>Request type<select name="requestType"><option>Repair</option><option>Maintenance</option><option>Diagnostic question</option><option>General question</option><option>Fleet / work-order review</option><option>Proof review</option></select></label>
<label>Urgency<select name="urgency"><option>Normal</option><option>Time-sensitive</option><option>Safety risk</option></select></label>
<label>Issue or question<textarea name="issue" required></textarea></label>
<label>Symptoms / codes<textarea name="symptoms"></textarea></label>
<label>History<textarea name="history"></textarea></label>
<label>Photos / proof / links<textarea name="proof"></textarea></label>
<label>Requested outcome<select name="outcome"><option>Quote</option><option>Review</option><option>Diagnostic direction</option><option>Next action</option><option>Proof record</option></select></label>
<button class="btn" type="submit">Create Proof Record</button>
</form></section>
<section id="resultCard" class="card hidden"><h2>Gauge Result</h2><p id="status" class="note"></p><div id="result" class="result"></div><div class="actions"><a id="sendEmail" class="btn hidden" href="#">Send Owner Copy</a><a class="btn secondary" href="index.html">Back to GS&D</a></div></section>
</main>
<script>
const form=document.getElementById('intakeForm');
form.addEventListener('submit',async(event)=>{event.preventDefault();const button=form.querySelector('button');button.disabled=true;button.textContent='Writing Proof Record';const data=Object.fromEntries(new FormData(form).entries());data.source='web-form';try{const response=await fetch('/gauge/intake',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const record=await response.json();document.getElementById('resultCard').classList.remove('hidden');document.getElementById('status').textContent=record.result||record.error||'No proof record confirmed.';document.getElementById('result').textContent=[`Proof ID: ${record.proofId||'not created'}`,`Hash: ${record.hash||'not created'}`,`Source Check: ${record.sourceCheck||'not completed'}`,`Intent: ${record.parsedCommand?.intent||'not completed'}`,`Route: ${record.chosenRoute||'no route'}`,`Fallback: ${record.fallback||'hold'}`, '', record.summary||''].join('\n');const link=document.getElementById('sendEmail');if(record.ok&&record.mailto){link.href=record.mailto;link.classList.remove('hidden')}else{link.classList.add('hidden')}}catch{document.getElementById('resultCard').classList.remove('hidden');document.getElementById('status').textContent='No proof record was confirmed.';document.getElementById('result').textContent='Safe failure: this request is not accepted until Gauge returns a proof ID.'}finally{button.disabled=false;button.textContent='Create Proof Record'}});
</script>
</body></html>
